       chapado no meio. -->
  <rect width="512" height="512" rx="112" fill="#4F46E5"/>
  <g transform="translate(56 56) scale(6.25)">
    <path fill="#FFFFFF" fill-rule="evenodd" d="M32 8A27.713 27.713 0 0 1 32 56A27.713 27.713 0 0 1 32 8ZM32 26.8a5.2 5.2 0 1 0 0 10.4 5.2 5.2 0 1 0 0-10.4Z"/>

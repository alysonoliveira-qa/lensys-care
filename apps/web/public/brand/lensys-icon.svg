<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Lensys Care">
  <title>Lensys Care</title>
  <!-- Ícone quadrado: é este que o App Review da Meta pede, e também a base
       do favicon e do ícone de PWA. Exporte em PNG 512×512 e 1024×1024 a

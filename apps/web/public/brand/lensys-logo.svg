<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" width="240" height="64" role="img" aria-label="Lensys Care">
  <title>Lensys Care</title>
  <!-- Assinatura horizontal, tema claro. O texto é <text>, não contorno:
       renderiza certo onde a Geist estiver instalada e cai num fallback
       decente onde não estiver. Antes de mandar para gráfica ou para
       terceiro, converta em curvas. -->

    <path fill="#4F46E5" fill-rule="evenodd" d="M32 8A27.713 27.713 0 0 1 32 56A27.713 27.713 0 0 1 32 8ZM32 26.8a5.2 5.2 0 1 0 0 10.4 5.2 5.2 0 1 0 0-10.4Z"/>
    <path fill="none" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="2.4" stroke-linecap="round" d="M25.07 19.01A24.513 24.513 0 0 0 21.37 30.72"/>
  </g>
  <text x="44" y="42" font-family="Geist, 'Geist Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" letter-spacing="-0.6">
    <tspan fill="#0E1129" font-weight="600">Lensys</tspan><tspan fill="#4F46E5" font-weight="400" dx="7">Care</tspan>
  </text>
</svg>
